name: Mobile Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Align dependencies with the installed Expo SDK
        run: npx expo install --fix
      - name: Report Expo dependency alignment
        run: git diff --stat -- package.json package-lock.json
      - name: TypeScript checks
        run: npm run typecheck
      - name: Unit and calculator tests
        run: npm test
      - name: Expo configuration diagnostics
        run: npx expo-doctor
