name: Mobile Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Align dependencies with the installed Expo SDK
        run: npx expo install --fix
      - name: Commit Expo-compatible dependency versions
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Align Expo dependencies with SDK 57"
            git push
          else
            echo "Expo dependencies already match the SDK."
          fi
      - name: TypeScript checks
        run: npm run typecheck
      - name: Unit and calculator tests
        run: npm test
      - name: Expo configuration diagnostics
        run: npx expo-doctor
